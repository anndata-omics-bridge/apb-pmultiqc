[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[project]
name = "apb-pmultiqc"
version = "0.1.1"
description = "Generate pMultiQC reports from stored APB results through QPX"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Witold Wolski", email = "wew@fgcz.ethz.ch" },
]
dependencies = [
    "apb-export>=0.2.2,<0.3",
    "apb2[duckdb]>=0.1.4,<0.2",
    "apb-catalog>=0.1.6,<0.2",
    "apb-fasta>=0.1.2,<0.2",
    "protein-fasta>=0.3.2,<0.4",
    "prozor>=0.1.2,<0.2",
    "pmultiqc @ git+https://github.com/wolski/pmultiqc.git@ae84c631650faa91c40dd0212289c26002c0c4b7",
    "pyopenms==3.5.0",
    "multiqc==1.35",
    "cyclopts>=4,<5",
    "loguru>=0.7,<1",
]

[project.scripts]
apb-pmultiqc = "apb_pmultiqc.cli:main"

[dependency-groups]
dev = [
    "polars>=1.43,<2",
    "build>=1.3,<2",
    "deptry>=0.24,<1",
    "pre-commit>=4,<5",
    "pyright==1.1.414",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff==0.16.10",
    "twine>=6,<7",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "ANN",
    "B",
    "C4",
    "C90",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "PGH",
    "PIE",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
include = ["src", "tests", "scripts"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportImportCycles = "error"
reportMissingTypeStubs = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportImplicitOverride = "error"
enableTypeIgnoreComments = false

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]
pythonpath = ["."]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["apb_pmultiqc"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.deptry]
known_first_party = ["apb_pmultiqc", "scripts"]

[tool.deptry.per_rule_ignores]
# The application pins its entire APB stack and invokes MultiQC with its pMultiQC plugin.
DEP002 = ["apb-catalog", "apb-fasta", "protein-fasta", "prozor", "multiqc", "pmultiqc", "pyopenms"]

[tool.uv]
required-version = "==0.12.17"
no-sources = true

[tool.uv.build-backend]
source-include = ["uv.lock", ".python-version", "docs/**", "Makefile", "scripts/**"]
